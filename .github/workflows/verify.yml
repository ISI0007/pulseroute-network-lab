name: Verify PulseRoute
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "deliverables/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core race tests
        shell: bash
        run: |
          mkdir -p build/evidence
          set -o pipefail
          go test -json -race ./... -count=1 | tee build/evidence/linux-tests.jsonl
      - run: go vet ./...
      - name: Record loopback experiments
        shell: bash
        run: |
          go run ./cmd/pulseroute -mode selftest -data build/experiment-data -count 100 -bytes 1024 > build/evidence/linux-loopback.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification
          path: build/evidence/*
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Core tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/evidence | Out-Null
          go test -json ./... -count=1 | Tee-Object build/evidence/windows-tests.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: WebRTC lifecycle with synthetic media
        run: node scripts/check-rtc.cjs
      - name: QR round-trip
        run: node scripts/check-qr.cjs
      - name: Real nearby browser upload and download
        shell: pwsh
        run: |
          $env:PULSEROUTE_BROWSER_TEST = "1"
          go test -json ./internal/nearby -run TestBrowserPortal -count=1 | Tee-Object build/evidence/nearby-browser.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Desktop backend tests
        shell: pwsh
        run: |
          go test -json -tags desktop . -count=1 | Tee-Object build/evidence/desktop-tests.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: go vet -tags desktop .
      - name: Generate consistent Windows product metadata
        run: ./scripts/windows-resources.ps1
      - run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/PulseRoute.exe .
      - run: go build -o build/bin/pulseroute-cli.exe ./cmd/pulseroute
      - name: Verify Windows product metadata
        shell: pwsh
        run: |
          $metadata = foreach ($name in @('PulseRoute.exe','pulseroute-cli.exe')) {
            $info = (Get-Item "build/bin/$name").VersionInfo
            if ($info.ProductName -ne 'PulseRoute' -or $info.ProductVersion -ne '0.1.0.0' -or $info.FileVersion -ne '0.1.0.0') { throw "Incorrect product metadata in $name" }
            [ordered]@{file=$name;product=$info.ProductName;version=$info.ProductVersion;fileVersion=$info.FileVersion;brand=$info.CompanyName}
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding UTF8 build/evidence/windows-product-metadata.json
      - name: Collect notices from the actual build toolchain
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $moduleCache = go env GOMODCACHE
          $runtimeRoot = go env GOROOT
          python scripts/collect-notices.py --module-cache $moduleCache --go-root $runtimeRoot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reject unsigned distribution packages
        shell: pwsh
        run: |
          try {
            ./scripts/package-signed.ps1 -SourceCommit $env:GITHUB_SHA -VerifyOnly
            throw 'Unsigned distribution unexpectedly succeeded'
          } catch {
            if ($_.Exception.Message -notlike '*requires a valid timestamped Authenticode signature*') { throw }
            if (Test-Path build/distribution) { throw 'Unsigned distribution directory was created' }
            Write-Output 'PASS: unsigned binaries rejected; no distribution ZIP created'
          }
      - name: Record loopback experiments
        shell: pwsh
        run: |
          ./build/bin/pulseroute-cli.exe -mode selftest -data build/experiment-data -count 100 -bytes 1024 > build/evidence/windows-loopback.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: build/evidence/*
      - name: Prepare unsigned portable development artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/portable | Out-Null
          foreach ($name in @('PulseRoute.exe','pulseroute-cli.exe')) {
            Copy-Item -LiteralPath "build/bin/$name" -Destination "build/portable/$name"
          }
          foreach ($name in @('LICENSE','THIRD_PARTY_NOTICES.txt')) {
            Copy-Item -LiteralPath $name -Destination "build/portable/$name"
          }
          Copy-Item docs/UNSIGNED_PREVIEW.md build/portable/READ-ME.md
          Copy-Item docs/PRIVACY.md build/portable/PRIVACY.md
          Copy-Item docs/DISTRIBUTION.md build/portable/DISTRIBUTION.md
          $files = Get-FileHash build/portable/*.exe -Algorithm SHA256 | ForEach-Object {
            [ordered]@{file=(Split-Path $_.Path -Leaf);sha256=$_.Hash;signatureStatus=[string](Get-AuthenticodeSignature -LiteralPath $_.Path).Status}
          }
          [ordered]@{sourceCommit=$env:GITHUB_SHA;status='UNSIGNED development preview';files=$files} | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 build/portable/build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pulseroute-windows
          path: build/portable/*

  native-smoke:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pulseroute-windows
          path: build/native-bin
      - name: Native Wails window and real bridge smoke test
        shell: pwsh
        run: ./scripts/native-smoke.ps1 -Executable build/native-bin/PulseRoute.exe -EvidenceDirectory build/native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-verification
          path: |
            build/native-evidence/native-ui-result.json
            build/native-evidence/native-stdout.txt
            build/native-evidence/native-stderr.txt
            build/native-evidence/native-accessibility-tree.json
            build/native-evidence/native-settings.png
