name: Verify PulseRoute
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
      - run: go vet ./...
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: go test ./... -count=1
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet -tags desktop .
      - run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/PulseRoute.exe .
      - run: go build -o build/bin/pulseroute-cli.exe ./cmd/pulseroute
      - uses: actions/upload-artifact@v4
        with:
          name: pulseroute-windows
          path: build/bin/*.exe
